[project]
name = "offerleaks-api"
version = "0.1.0"
description = "OfferLeaks backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "cryptography",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "google-cloud-documentai>=2.29",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "redis>=5.1",
    "rq>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerleaks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Alembic owns migrations/versions/*.py's boilerplate (op/sa imports,
# Sequence|None style) -- not worth fighting the generator's output
# style. env.py and script.py.mako (hand-touched) are still linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends(...)-as-default-argument is the framework's
# idiomatic DI pattern, not the footgun this rule is designed to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
# Module-level singletons (the SQLAlchemy engine, the Redis client -- see
# core/db.py, core/redis.py) are created once and bound to whichever event
# loop first uses them, matching how the app actually runs (one process,
# one loop). pytest-asyncio's default is a *new* loop per test function,
# which breaks those singletons on the second test ("Event loop is
# closed"). Session-scoped loop matches production reality instead of
# fighting it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
