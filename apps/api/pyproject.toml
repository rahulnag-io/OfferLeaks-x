[project]
name = "offerleaks-api"
version = "0.1.0"
description = "OfferLeaks backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "redis>=5.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerleaks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Alembic owns migrations/versions/*.py's boilerplate (op/sa imports,
# Sequence|None style) -- not worth fighting the generator's output
# style. env.py and script.py.mako (hand-touched) are still linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends(...)-as-default-argument is the framework's
# idiomatic DI pattern, not the footgun this rule is designed to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
